version: 1

# blueprints pass `context` to `!Context`; here it also holds what every browser shares
context:
  provider: &provider
    authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
    invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

    mode: forward_single

entries:
  dependencies:
    - model: authentik_blueprints.metaapplyblueprint
      attrs:
        identifiers:
          path: users.yaml

    - model: authentik_blueprints.metaapplyblueprint
      attrs:
        identifiers:
          name: Default - Provider authorization flow (implicit consent)

    - model: authentik_blueprints.metaapplyblueprint
      attrs:
        identifiers:
          name: Default - Provider invalidation flow

  # keep-sorted start block=yes newline_separated=yes
  hilorioze:
    - model: authentik_providers_proxy.proxyprovider
      id: agentbox-browser-hilorioze-provider
      identifiers:
        name: agentbox-browser-hilorioze
      attrs:
        <<: *provider

        external_host: https://browser.hilorioze.agentbox.@domain@

    - model: authentik_core.application
      identifiers:
        slug: agentbox-browser-hilorioze
      attrs:
        name: Agentbox browser (hilorioze)
        provider: !KeyOf agentbox-browser-hilorioze-provider

    - model: authentik_policies.policybinding
      identifiers:
        target: !Find [authentik_core.application, [slug, agentbox-browser-hilorioze]]
        user: !Find [authentik_core.user, [username, hilorioze]]
      attrs:
        order: 0

    - model: authentik_policies.policybinding
      identifiers:
        target: !Find [authentik_core.application, [slug, agentbox-browser-hilorioze]]
        group: !Find [authentik_core.group, [name, authentik Admins]]
      attrs:
        order: 1
  # keep-sorted end
