version: 2

updates:
  - package-ecosystem: github-actions

    directory: /

    schedule:
      # Run weekly on Mondays at 00:00 UTC
      interval: weekly
      day: monday
      time: "00:00"

    groups:
      github-actions:
        patterns:
          - "*"

    assignees:
      - hilorioze

    labels:
      - dependencies
      - github_actions
      - automated

    commit-message:
      prefix: chore(deps/github-actions)

  - package-ecosystem: nix

    directory: /

    schedule:
      # Run weekly on Mondays at 00:00 UTC
      interval: weekly
      day: monday
      time: "00:00"

    groups:
      nix:
        patterns:
          - "*"

    assignees:
      - hilorioze

    labels:
      - dependencies
      - nix
      - automated

    commit-message:
      prefix: chore(deps/nix)
