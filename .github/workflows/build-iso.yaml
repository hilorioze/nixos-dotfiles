on:
  push:
    branches: &branches
      - main

    paths: &paths
      - .github/workflows/build-iso.yaml
      - .github/actions/setup-niks3/action.yml
      - .github/actions/setup-nix/action.yml

      - "**/*.nix"
      - "!devenv.nix"
      - "**/secrets.yaml"
      - "**/*.patch"
      - "**/*.diff"
      - "**/*.pub"
      - flake.lock

  pull_request:
    branches: *branches

    paths: *paths

  workflow_dispatch:

jobs:
  build-iso:
    permissions:
      id-token: write # required so niks3 can authenticate via oidc
      contents: write # required for publishing releases

    concurrency:
      # one run per pull request number or branch; latest completes last
      group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}

      cancel-in-progress: false

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-nix

      - id: setup-niks3
        uses: ./.github/actions/setup-niks3

      - id: build
        run: |
          result=$(nix build --no-link --print-out-paths --print-build-logs .#nixosConfigurations.hisonix.config.system.build.isoImage)

          {
            printf 'result=%s\n' $result

            if [[ ${{ github.event_name }} != pull_request ]]; then
              printf 'content_hash=%s\n' $(nix hash path --type sha256 --base32 $result)
            fi
          } >> $GITHUB_OUTPUT

      - if: steps.setup-niks3.outputs.push
        run: ${{ steps.setup-niks3.outputs.push }} ${{ steps.build.outputs.result }}

      - if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.build.outputs.content_hash }}
          commit: ${{ github.sha }} # pin release to the build commit

          body: |
            Fetch the ISO from the binary cache:

            ```sh
            nix build \
              --extra-substituters https://nix-cache.hilorioze.com \
              github:${{ github.repository }}/${{ github.sha }}#nixosConfigurations.hisonix.config.system.build.isoImage
            ```

          makeLatest: true
          skipIfReleaseExists: true
