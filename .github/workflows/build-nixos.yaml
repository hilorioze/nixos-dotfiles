on:
  push:
    branches: &branches
      - main

    paths: &paths
      - '.github/workflows/build-nixos.yaml'

      - '**/*.nix'
      - '!devenv.nix'
      - '**/secrets.yaml'
      - '**/*.patch'
      - '**/*.diff'
      - '**/*.pub'
      - 'flake.lock'

  pull_request:
    branches: *branches

    paths: *paths

  workflow_dispatch:
    inputs:
      target-configurations:
        description: 'Build `all` configurations or pass a JSON array like `["de0","hel0"]`'

        type: string
        required: false
        default: all

jobs:
  collect-targets:
    runs-on: ubuntu-latest

    outputs:
      target-configurations: ${{ steps.collect-targets.outputs['target-configurations'] }}

      extra-substituters: ${{ steps.collect-targets.outputs['extra-substituters'] }}
      extra-trusted-public-keys: ${{ steps.collect-targets.outputs['extra-trusted-public-keys'] }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: &extra_nix_config |
            accept-flake-config = true

            # resolved by follow-up jobs via `*extra_nix_config`; empty strings are safe here
            extra-substituters = ${{ needs.collect-targets.outputs['extra-substituters'] }}
            extra-trusted-public-keys = ${{ needs.collect-targets.outputs['extra-trusted-public-keys'] }}

            fsync-metadata = false # performance over durability in CI; store is transient

      - id: collect-targets
        env:
          TARGET_CONFIGURATIONS: ${{ inputs['target-configurations'] || 'all' }}
        run: |
          if [ "$TARGET_CONFIGURATIONS" = all ]; then
            target_configurations=$(nix eval --apply builtins.attrNames --json .#nixosConfigurations)
          else
            target_configurations=$TARGET_CONFIGURATIONS
          fi

          include='[]'
          for target in $(echo "$target_configurations" | jq -r '.[]'); do
            system=$(nix eval --raw .#nixosConfigurations.${target}.config.nixpkgs.hostPlatform.system)

            # no `ubuntu-latest-arm` alias; pinned to `ubuntu-24.04-arm`
            # update when a newer image or the alias becomes available
            case $system in
              aarch64-linux) runner=ubuntu-24.04-arm ;;
              x86_64-linux)  runner=ubuntu-latest ;;
            esac

            include=$(echo "$include" | jq -c --arg target $target --arg runner $runner '. + [{"target": $target, "runner": $runner}]')
          done

          echo "target-configurations={\"include\":$include}" >> $GITHUB_OUTPUT

          echo "extra-substituters=$(nix eval --raw --file flake.nix --apply 'flake: builtins.concatStringsSep " " flake.nixConfig.extra-substituters')" >> $GITHUB_OUTPUT
          echo "extra-trusted-public-keys=$(nix eval --raw --file flake.nix --apply 'flake: builtins.concatStringsSep " " flake.nixConfig.extra-trusted-public-keys')" >> $GITHUB_OUTPUT

  build-configurations:
    needs: collect-targets

    permissions:
      id-token: write

    strategy:
      matrix: ${{ fromJSON(needs.collect-targets.outputs['target-configurations']) }}

      fail-fast: false # don't cancel the matrix if one job fails

    concurrency:
      # one run per ref and target; latest completes last
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.target }}

      cancel-in-progress: false

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
        with:
          # do not use the default 'cleave' protocol because its background process purges `/opt` and deletes the `niks3-hook` binary
          hatchet-protocol: 'carve'

          root-safe-haven: 1024 # halved; logs show 1 GiB free on / suffices

          nix-permission-edict: true

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: *extra_nix_config

      - uses: Mic92/niks3-action@a3da573cc4d21634990e5f21391abe55ed49ec46 # v1.0.2
        with:
          server-url: ${{ vars.NIKS3_SERVER_URL }}

          skip-push: ${{ github.event_name == 'pull_request' }}

          debug: true

      - run: nix build --no-link --print-build-logs .#nixosConfigurations.${{ matrix.target }}.config.system.build.toplevel

      - if: failure()
        run: |
          cat /home/runner/work/_temp/niks3/daemon.log
