on:
  workflow_dispatch:
    inputs:
      target-nodes:
        description: 'Deploy `all` nodes or pass a JSON array like `["de0","hel0"]`'

        type: string
        required: false
        default: all

      ping-nodes:
        description: 'Whether to ping nodes before deployment; set to `false` to skip pings'

        type: boolean
        required: false
        default: true

jobs:
  collect-targets:
    outputs:
      target-nodes: ${{ steps.collect-targets.outputs['target-nodes'] }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-nix

      - id: collect-targets
        env:
          TARGET_NODES: ${{ inputs['target-nodes'] }}
        run: |
          include=$(nix eval --json --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);

              # no `ubuntu-latest-arm` alias; pinned to `ubuntu-24.04-arm`
              # update when a newer image or the alias becomes available
              runners = {
                # keep-sorted start
                aarch64-linux = "ubuntu-24.04-arm";
                x86_64-linux = "ubuntu-latest";
                # keep-sorted end
              };
            in
              map (node: {
                inherit node;

                runner = runners.${flake.deploy.nodes.${node}.profiles.system.path.system};

                inherit (flake.deploy.nodes.${node}) hostname;

                in-tailnet = flake.nixosConfigurations.${node}.config.services.tailscale.enable; # hosts outside the tailnet are deployed over their public sshd
              })
              (builtins.attrNames flake.deploy.nodes)
          ')

          if [[ $TARGET_NODES != all ]]; then
            include=$(jq --compact-output --argjson target_nodes "$TARGET_NODES" 'map(select(.node | IN($target_nodes[])))' <<<$include)
          fi

          printf 'target-nodes={"include": %s}\n' "$include" >> $GITHUB_OUTPUT

  deploy-nodes:
    needs: collect-targets

    permissions:
      id-token: write # required so niks3 can authenticate via oidc

    strategy:
      matrix: ${{ fromJSON(needs.collect-targets.outputs['target-nodes']) }}

      fail-fast: false # don't cancel the matrix if one job fails

    concurrency:
      # one run per workflow and node (prevents concurrent deploys for the same node); latest completes last
      group: ${{ github.workflow }}-${{ matrix.node }}

      cancel-in-progress: false

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-nix

      - if: matrix['in-tailnet']
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          authkey: ${{ secrets.DEPLOYER_TAILSCALE_AUTH_KEY }}

          hostname: deploy-${{ matrix.node }}-${{ github.run_number }}
          args: --login-server ${{ vars.TAILSCALE_LOGIN_SERVER_URL }}

          ping: ${{ inputs['ping-nodes'] && matrix.hostname || '' }}

      - run: |
          install -D --mode=600 /dev/stdin ~/.ssh/id_ed25519 <<<"${{ secrets.DEPLOYER_SSH_PRIVATE_KEY }}"

          install --mode=600 /dev/stdin ~/.ssh/known_hosts <<<"${{ matrix.hostname }},[${{ matrix.hostname }}]:* $(<hosts/${{ matrix.node }}/ssh_host_ed25519_key.pub)"

      - uses: ./.github/actions/setup-niks3

      - run: nix run --inputs-from . --print-build-logs nixpkgs#deploy-rs -- --skip-checks .#${{ matrix.node }}
