on:
  workflow_dispatch:
    inputs:
      target-nodes:
        description: 'Deploy `all` nodes or pass a JSON array like `["de0","hel0"]`'

        type: string
        required: false
        default: all

      ping-nodes:
        description: 'Whether to ping nodes before deployment; set to `false` to skip pings'

        type: boolean
        required: false
        default: true

jobs:
  collect-targets:
    outputs:
      target-nodes: ${{ steps.collect-targets.outputs['target-nodes'] }}

      extra-substituters: ${{ steps.collect-targets.outputs['extra-substituters'] }}
      extra-trusted-public-keys: ${{ steps.collect-targets.outputs['extra-trusted-public-keys'] }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: &extra_nix_config |
            accept-flake-config = true

            # resolved by follow-up jobs via `*extra_nix_config`; empty strings are safe here
            extra-substituters = ${{ needs.collect-targets.outputs['extra-substituters'] }}
            extra-trusted-public-keys = ${{ needs.collect-targets.outputs['extra-trusted-public-keys'] }}

            fsync-metadata = false # performance over durability in ci; store is transient

            fallback = true # build from source when a substituter fails mid-download instead of failing the job

      - id: collect-targets
        env:
          TARGET_NODES: ${{ inputs['target-nodes'] }}
        run: |
          include=$(nix eval --json .#deploy.nodes --apply '
            nodes: let
              # no `ubuntu-latest-arm` alias; pinned to `ubuntu-24.04-arm`
              # update when a newer image or the alias becomes available
              runners = {
                # keep-sorted start
                aarch64-linux = "ubuntu-24.04-arm";
                x86_64-linux = "ubuntu-latest";
                # keep-sorted end
              };
            in
              map (node: {
                inherit node;

                runner = runners.${nodes.${node}.profiles.system.path.system};

                fqdn = nodes.${node}.hostname;
              })
              (builtins.attrNames nodes)
          ')

          if [[ $TARGET_NODES != all ]]; then
            include=$(jq --compact-output --argjson target_nodes "$TARGET_NODES" 'map(select(.node | IN($target_nodes[])))' <<<$include)
          fi

          {
            printf 'target-nodes={"include": %s}\n' "$include"

            printf 'extra-substituters=%s\n' "$(nix eval --raw --file flake.nix --apply 'flake: builtins.concatStringsSep " " flake.nixConfig.extra-substituters')"
            printf 'extra-trusted-public-keys=%s\n' "$(nix eval --raw --file flake.nix --apply 'flake: builtins.concatStringsSep " " flake.nixConfig.extra-trusted-public-keys')"
          } >> $GITHUB_OUTPUT

  deploy-nodes:
    needs: collect-targets

    permissions:
      id-token: write # required so niks3 can authenticate via oidc

    strategy:
      matrix: ${{ fromJSON(needs.collect-targets.outputs['target-nodes']) }}

      fail-fast: false # don't cancel the matrix if one job fails

    concurrency:
      # one run per workflow and node (prevents concurrent deploys for the same node); latest completes last
      group: ${{ github.workflow }}-${{ matrix.node }}

      cancel-in-progress: false

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
        with:
          hatchet-protocol: 'carve' # keep node available for the `$RUNNER_TEMP/niks3/fetch-oidc-token.mjs` script

          root-safe-haven: 1024 # halved; logs show 1 GiB free on / suffices

          nix-permission-edict: true

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: *extra_nix_config

      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          authkey: ${{ secrets.DEPLOYER_TAILSCALE_AUTH_KEY }}

          hostname: deploy-${{ matrix.node }}-${{ github.run_number }}
          args: --login-server ${{ vars.TAILSCALE_LOGIN_SERVER_URL }}

          ping: ${{ inputs['ping-nodes'] && matrix.fqdn || '' }}

      - run: |
          install -D --mode=600 /dev/stdin ~/.ssh/id_ed25519 <<<"${{ secrets.DEPLOYER_SSH_PRIVATE_KEY }}"

          install --mode=600 /dev/stdin ~/.ssh/known_hosts <<<"${{ matrix.fqdn }} $(<hosts/${{ matrix.node }}/ssh_host_ed25519_key.pub)"

      - id: fetch-niks3-bin
        run: |
          cat "$(nix build --impure --no-link --print-out-paths --print-build-logs --expr '
            let
              flake = builtins.getFlake (toString ./.);
              system = builtins.currentSystem;

              pkgs = flake.inputs.nixpkgs.legacyPackages.${system};

              niks3 = flake.legacyPackages.${system}.niks3;
            in
              pkgs.writeText "niks3-github-output" (pkgs.lib.generators.toKeyValue {} {
                niks3_root = niks3;

                niks3_bin = pkgs.lib.getExe niks3;
              })
          ')" >>$GITHUB_OUTPUT

      - uses: Mic92/niks3-action@fba0a36eda892f9b28b0ead8038f993920ecaff9 # v1.6.0
        with:
          niks3-bin: ${{ steps.fetch-niks3-bin.outputs.niks3_bin }}

          server-url: ${{ vars.NIKS3_SERVER }}

      # cache the built `fetch-niks3-bin` output so later runs can reuse it
      - run: ${{ steps.fetch-niks3-bin.outputs.niks3_bin }} push --server-url ${{ vars.NIKS3_SERVER }} --auth-token-script "node $RUNNER_TEMP/niks3/fetch-oidc-token.mjs" ${{ steps.fetch-niks3-bin.outputs.niks3_root }}

      - run: nix run --inputs-from . --print-build-logs nixpkgs#deploy-rs -- --skip-checks .#${{ matrix.node }}
