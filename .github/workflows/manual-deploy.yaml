on:
  workflow_dispatch:
    inputs:
      target-nodes:
        description: 'Deploy `all` nodes or pass a JSON array like `["de0","hel0"]`'

        type: string
        required: false
        default: all

      ping-nodes:
        description: 'Whether to ping nodes before deployment; set to `false` to skip pings'

        type: boolean
        required: false
        default: true

jobs:
  collect-targets:
    outputs:
      target-nodes: ${{ steps.collect-targets.outputs['target-nodes'] }}

      extra-substituters: ${{ steps.collect-targets.outputs['extra-substituters'] }}
      extra-trusted-public-keys: ${{ steps.collect-targets.outputs['extra-trusted-public-keys'] }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: &extra_nix_config |
            accept-flake-config = true

            # resolved by follow-up jobs via `*extra_nix_config`; empty strings are safe here
            extra-substituters = ${{ needs.collect-targets.outputs['extra-substituters'] }}
            extra-trusted-public-keys = ${{ needs.collect-targets.outputs['extra-trusted-public-keys'] }}

            fsync-metadata = false # performance over durability in CI; store is transient

      - id: collect-targets
        env:
          TARGET_NODES: ${{ inputs['target-nodes'] }}
        run: |
          if [ "$TARGET_NODES" = all ]; then
            target_nodes=$(nix eval --apply builtins.attrNames --json .#deploy.nodes)
          else
            target_nodes=$TARGET_NODES
          fi

          include='[]'
          for node in $(echo "$target_nodes" | jq -r '.[]'); do
            system=$(nix eval --raw .#deploy.nodes.${node}.profiles.system.path.system)
            fqdn=$(nix eval --raw .#deploy.nodes.${node}.hostname)

            # no `ubuntu-latest-arm` alias; pinned to `ubuntu-24.04-arm`
            # update when a newer image or the alias becomes available
            case $system in
              aarch64-linux) runner=ubuntu-24.04-arm ;;
              x86_64-linux)  runner=ubuntu-latest ;;
            esac

            include=$(echo "$include" | jq -c --arg node $node --arg runner $runner --arg fqdn $fqdn '. + [{"node": $node, "runner": $runner, "fqdn": $fqdn}]')
          done

          echo "target-nodes={\"include\":$include}" >> $GITHUB_OUTPUT

          echo "extra-substituters=$(nix eval --raw --file flake.nix --apply 'flake: builtins.concatStringsSep " " flake.nixConfig.extra-substituters')" >> $GITHUB_OUTPUT
          echo "extra-trusted-public-keys=$(nix eval --raw --file flake.nix --apply 'flake: builtins.concatStringsSep " " flake.nixConfig.extra-trusted-public-keys')" >> $GITHUB_OUTPUT

  deploy-nodes:
    needs: collect-targets

    permissions:
      id-token: write

    strategy:
      matrix: ${{ fromJSON(needs.collect-targets.outputs['target-nodes']) }}

      fail-fast: false # don't cancel the matrix if one job fails

    concurrency:
      # one run per workflow and node (prevents concurrent deploys for the same node); latest completes last
      group: ${{ github.workflow }}-${{ matrix.node }}

      cancel-in-progress: false

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
        with:
          hatchet-protocol: 'carve' # keep `node` available for the `$RUNNER_TEMP/niks3/fetch-oidc-token.mjs` script

          root-safe-haven: 1024 # halved; logs show 1 GiB free on / suffices

          nix-permission-edict: true

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: *extra_nix_config

      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          authkey: ${{ secrets.DEPLOYER_TAILSCALE_AUTH_KEY }}

          hostname: deploy-${{ matrix.node }}-${{ github.run_number }}
          args: --login-server ${{ vars.TAILSCALE_LOGIN_SERVER_URL }}

          ping: ${{ inputs['ping-nodes'] && matrix.fqdn || '' }}

      - run: |
          install -Dm 600 /dev/stdin ~/.ssh/id_ed25519 <<<"${{ secrets.DEPLOYER_SSH_PRIVATE_KEY }}"

          install -m 600 /dev/stdin ~/.ssh/known_hosts <<<"${{ matrix.fqdn }} $(< hosts/${{ matrix.node }}/ssh_host_ed25519_key.pub)"

      - id: fetch-niks3-bin
        run: |
          # `niks3-action` looks for `niks3-hook` next to `niks3`
          niks3_root=$(NIX_PATH=nixpkgs=flake:nixpkgs:niks3=flake:niks3 nix build --impure --no-link --print-out-paths --inputs-from . --print-build-logs --expr $'
          let
            pkgs = import <nixpkgs> {};

            lib = pkgs.lib;

            niks3ActionBinDir = pkgs.symlinkJoin {
              name = "niks3-action-bin-dir";

              paths = with import <niks3/nix/packages> {inherit pkgs;}; [
                # keep-sorted start
                niks3
                niks3-hook
                # keep-sorted end
              ];
            };
          in
            pkgs.linkFarm "niks3-action-bin" [
              # keep-sorted start block=yes newline_separated=yes
              {
                name = "bin/niks3";

                path = lib.getExe\' niks3ActionBinDir "niks3";
              }

              {
                name = "bin/niks3-hook";

                path = lib.getExe\' niks3ActionBinDir "niks3-hook";
              }
              # keep-sorted end
            ]
            ')

          printf 'niks3_root=%s\nniks3_bin=%s\n' $niks3_root $niks3_root/bin/niks3 >> $GITHUB_OUTPUT

      - uses: Mic92/niks3-action@5e2abb3cfc970ffe49a117bc761bca8eefadd17f # v1.0.3
        with:
          niks3-bin: ${{ steps.fetch-niks3-bin.outputs.niks3_bin }} # keep cli and server on the same revision to avoid api mismatches

          server-url: ${{ vars.NIKS3_SERVER_URL }}

      # seed the cache so `niks3-hook` is substituted on later runs
      - if: github.event_name != 'pull_request'
        run: ${{ steps.fetch-niks3-bin.outputs.niks3_bin }} push --server-url ${{ vars.NIKS3_SERVER_URL }} --auth-token-script "node $RUNNER_TEMP/niks3/fetch-oidc-token.mjs" ${{ steps.fetch-niks3-bin.outputs.niks3_root }}

      - run: nix run --inputs-from . --print-build-logs nixpkgs#deploy-rs -- --skip-checks .#${{ matrix.node }}
