on:
  push:
    branches: &branches
      - main

    paths: &paths
      - .github/workflows/build-devenv.yaml
      - .github/actions/setup-niks3/action.yaml
      - .github/actions/setup-nix/action.yaml

      - devenv.nix
      - devenv.lock
      - shared.nix

      # workflow reads `nixConfig` and uses `.#devenv`, so changes to them may affect the result
      - flake.nix
      - flake.lock

  pull_request:
    branches: *branches

    paths: *paths

  workflow_dispatch:

  workflow_call:

jobs:
  build-devenv:
    permissions:
      id-token: write # required so niks3 can authenticate via oidc

    concurrency:
      # one run per pull request number or branch; latest completes last
      group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}

      cancel-in-progress: false

    runs-on: ubuntu-latest

    env:
      # callers run the devenv of nixos-dotfiles; its own runs take the one of the checked out commit
      DEVENV: ${{ github.repository == 'hilorioze/nixos-dotfiles' && '.' || 'github:hilorioze/nixos-dotfiles' }}#devenv

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # not `./`: callers check out their own repo
      - uses: hilorioze/nixos-dotfiles/.github/actions/setup-nix@main

      - uses: hilorioze/nixos-dotfiles/.github/actions/setup-niks3@main

      - run: nix run $DEVENV -- build test
