on:
  push:
    branches: &branches
      - main

    paths: &paths
      - .github/workflows/build-devenv.yaml

      - devenv.nix
      - devenv.lock
      - devenv.yaml

      # workflow reads `nixConfig` and uses `--inputs-from .`, so changes to them may affect the result
      - flake.nix
      - flake.lock

  pull_request:
    branches: *branches

    paths: *paths

  workflow_dispatch:

jobs:
  collect-substituters:
    runs-on: ubuntu-latest

    outputs:
      extra-substituters: ${{ steps.collect-substituters.outputs['extra-substituters'] }}
      extra-trusted-public-keys: ${{ steps.collect-substituters.outputs['extra-trusted-public-keys'] }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: &extra_nix_config |
            accept-flake-config = true

            # resolved by follow-up jobs via `*extra_nix_config`; empty strings are safe here
            extra-substituters = ${{ needs.collect-substituters.outputs['extra-substituters'] }}
            extra-trusted-public-keys = ${{ needs.collect-substituters.outputs['extra-trusted-public-keys'] }}

            fsync-metadata = false # performance over durability in CI; store is transient

      - id: collect-substituters
        run: |
          echo "extra-substituters=$(nix eval --raw --file flake.nix --apply 'flake: builtins.concatStringsSep " " flake.nixConfig.extra-substituters')" >> $GITHUB_OUTPUT
          echo "extra-trusted-public-keys=$(nix eval --raw --file flake.nix --apply 'flake: builtins.concatStringsSep " " flake.nixConfig.extra-trusted-public-keys')" >> $GITHUB_OUTPUT

  build-devenv:
    needs: collect-substituters

    permissions:
      id-token: write

    strategy:
      matrix:
        runner:
          # no `ubuntu-latest-arm` alias; pinned to `ubuntu-24.04-arm`
          # update when a newer image or the alias becomes available
          # keep-sorted start
          - ubuntu-24.04-arm
          - ubuntu-latest
          # keep-sorted end

      fail-fast: false # don't cancel the matrix if one job fails

    concurrency:
      # one run per runner and whether it's a pull request or not (prevents the same build from running twice at the same time); latest completes last
      group: ${{ github.workflow }}-${{ matrix.runner }}-${{ github.event_name == 'pull_request' && 'pr' || 'non-pr' }}

      cancel-in-progress: false

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: *extra_nix_config

      - if: github.event_name != 'pull_request'
        id: fetch-niks3-bin
        run: |
          # `niks3-action` looks for `niks3-hook` next to `niks3`
          niks3_root=$(NIX_PATH=nixpkgs=flake:nixpkgs:niks3=flake:niks3 nix build --impure --no-link --print-out-paths --inputs-from . --print-build-logs --expr $'
          let
            pkgs = import <nixpkgs> {};

            lib = pkgs.lib;

            niks3ActionBinDir = pkgs.symlinkJoin {
              name = "niks3-action-bin-dir";

              paths = with import <niks3/nix/packages> {inherit pkgs;}; [
                # keep-sorted start
                niks3
                niks3-hook
                # keep-sorted end
              ];
            };
          in
            pkgs.linkFarm "niks3-action-bin" [
              # keep-sorted start block=yes newline_separated=yes
              {
                name = "bin/niks3";

                path = lib.getExe\' niks3ActionBinDir "niks3";
              }

              {
                name = "bin/niks3-hook";

                path = lib.getExe\' niks3ActionBinDir "niks3-hook";
              }
              # keep-sorted end
            ]
            ')

          printf 'niks3_root=%s\nniks3_bin=%s\n' $niks3_root $niks3_root/bin/niks3 >> $GITHUB_OUTPUT

      - if: github.event_name != 'pull_request'
        uses: Mic92/niks3-action@5e2abb3cfc970ffe49a117bc761bca8eefadd17f # v1.0.3
        with:
          niks3-bin: ${{ steps.fetch-niks3-bin.outputs.niks3_bin }} # keep cli and server on the same revision to avoid api mismatches

          server-url: ${{ vars.NIKS3_SERVER_URL }}

      # cache the built `fetch-niks3-bin` output so later runs can reuse it
      - if: github.event_name != 'pull_request'
        run: ${{ steps.fetch-niks3-bin.outputs.niks3_bin }} push --server-url ${{ vars.NIKS3_SERVER_URL }} --auth-token-script "node $RUNNER_TEMP/niks3/fetch-oidc-token.mjs" ${{ steps.fetch-niks3-bin.outputs.niks3_root }}

      - run: nix run --inputs-from . --print-build-logs nixpkgs#devenv -- build shell
