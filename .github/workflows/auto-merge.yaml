on:
  workflow_run:
    workflows:
      - .github/workflows/build.yaml

    types:
      - completed

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].base.ref == 'main' &&
      github.actor == 'dependabot[bot]'

    concurrency:
      # one merge attempt per pull request; latest cancels stale attempts
      group: ${{ github.workflow }}-${{ github.event.workflow_run.pull_requests[0].number }}

      cancel-in-progress: true

    runs-on: ubuntu-latest

    steps:
      - env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_PAT }}

          GH_REPO: ${{ github.repository }}
        run: |
          gh pr merge \
            ${{ github.event.workflow_run.pull_requests[0].number }} \
            --squash \
            --delete-branch \
            --match-head-commit ${{ github.event.workflow_run.head_sha }}
