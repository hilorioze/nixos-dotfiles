on:
  workflow_run:
    workflows:
      - .github/workflows/build.yaml
      - .github/workflows/build-devenv.yaml

    types:
      - completed

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].base.ref == 'main' &&
      github.actor == 'dependabot[bot]'

    concurrency:
      # one merge attempt per pull request; latest cancels stale attempts
      group: ${{ github.workflow }}-${{ github.event.workflow_run.pull_requests[0].number }}

      cancel-in-progress: true

    runs-on: ubuntu-latest

    steps:
      - env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_PAT }}

          GH_REPO: ${{ github.repository }}

          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          # wait for all PR checks to pass
          gh pr checks \
            $PR_NUMBER \
            --watch \
            --fail-fast

          gh pr merge \
            $PR_NUMBER \
            --squash \
            --delete-branch \
            --match-head-commit ${{ github.event.workflow_run.head_sha }}
