on:
  push:
    branches: &branches
      - main

    paths: &paths
      - .github/workflows/build.yaml
      - atelier.toml

      - "**/*.nix"
      - "!devenv.nix"
      - "**/secrets.yaml"
      - "**/*.patch"
      - "**/*.diff"
      - "**/*.pub"
      - flake.lock

  pull_request:
    branches: *branches

    paths: *paths

  workflow_dispatch:

permissions:
  contents: read # required so the reusable `atelier` workflow can read the repo
  checks: write # required so `atelier` can post skipped check runs

  id-token: write # required so `niks3` can authenticate via OIDC

jobs:
  discover:
    concurrency:
      # one run per pull request status; latest completes last
      group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && 'pr' || 'non-pr' }}

      cancel-in-progress: false

    uses: stepbrobd/atelier/.github/workflows/discover.yaml@35287e5a2733ec0835c71bf0bf9a2b479a613fcd # 2026.821.0
    with:
      extra-conf: | # `nix.conf`
        # https://github.com/stepbrobd/atelier/blob/8d6b6281f2d1f28b6115609df00f020e3042571f/.github/actions/atelier/action.yaml#L103-L106 already sets \`accept-flake-config\` and \`fsync-metadata\`

      push: ${{ github.event_name != 'pull_request' }}
