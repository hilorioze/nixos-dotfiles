on:
  push:
    branches:
      - main

    paths:
      - .github/workflows/cache-devenv-sources.yaml
      - .github/actions/setup-niks3/action.yaml
      - .github/actions/setup-nix/action.yaml

      - devenv.lock

      # workflow reads `nixConfig`, so changes to it may affect the result
      - flake.nix

  workflow_dispatch:

  workflow_call:

jobs:
  cache-devenv-sources:
    permissions:
      id-token: write # required so niks3 can authenticate via oidc

    concurrency:
      # one cache upload per branch; latest completes last
      group: ${{ github.workflow }}-${{ github.ref }}

      cancel-in-progress: false

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # not `./`: callers check out their own repo
      - uses: hilorioze/nixos-dotfiles/.github/actions/setup-nix@main

      - id: setup-niks3
        uses: hilorioze/nixos-dotfiles/.github/actions/setup-niks3@main

      - run: |
          set -o pipefail

          substituters=$(nix config show substituters)

          is_cached() {
            local base_name=${1#/nix/store/}
            local hash_part=${base_name%%-*}

            for substituter in $substituters; do
              nix store path-from-hash-part --store $substituter $hash_part >/dev/null 2>&1 && return 0
            done

            return 1
          }

          nix eval --raw --impure --expr '
            let
              lock = builtins.fromJSON (builtins.readFile ./devenv.lock);

              fetchNode = _: node:
                if node ? locked
                then let
                  cleanLocked = builtins.removeAttrs node.locked ["dir"];
                in
                  (builtins.fetchTree cleanLocked).outPath
                else null;

              paths = builtins.filter (path: path != null) (builtins.attrValues (builtins.mapAttrs fetchNode lock.nodes));
            in
              builtins.concatStringsSep "\n" paths + "\n"
          ' |
            sort --unique |
            while read path; do
              is_cached $path || printf '%s\n' $path
            done |
            xargs --no-run-if-empty ${{ steps.setup-niks3.outputs.push }}
