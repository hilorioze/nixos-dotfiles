on:
  push:
    branches:
      - main

    paths:
      - .github/workflows/cache-devenv-sources.yaml

      - devenv.lock

      # workflow reads `nixConfig` and uses `--inputs-from .`, so changes to them may affect the result
      - flake.nix
      - flake.lock

  workflow_dispatch:

jobs:
  cache-devenv-sources:
    permissions:
      id-token: write # required so niks3 can authenticate via oidc

    concurrency:
      # one cache upload per branch; latest completes last
      group: ${{ github.workflow }}-${{ github.ref }}

      cancel-in-progress: false

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            accept-flake-config = true

            fsync-metadata = false # performance over durability in ci; store is transient

            fallback = true # build from source when a substituter fails mid-download instead of failing the job

      - run: |
          {
            printf 'NIX_CONFIG<<EOF\n'
            printf 'extra-substituters = %s\n' "$(nix eval --raw --file flake.nix --apply 'flake: builtins.concatStringsSep " " flake.nixConfig.extra-substituters')"
            printf 'extra-trusted-public-keys = %s\n' "$(nix eval --raw --file flake.nix --apply 'flake: builtins.concatStringsSep " " flake.nixConfig.extra-trusted-public-keys')"
            printf 'EOF\n'
          } >> $GITHUB_ENV

      - id: fetch-niks3-bin
        run: |
          cat "$(nix build --impure --no-link --print-out-paths --print-build-logs --expr '
            let
              flake = builtins.getFlake "github:hilorioze/nixos-dotfiles";
              system = builtins.currentSystem;

              pkgs = flake.inputs.nixpkgs.legacyPackages.${system};

              niks3 = flake.legacyPackages.${system}.niks3;
            in
              pkgs.writeText "niks3-github-output" (pkgs.lib.generators.toKeyValue {} {
                niks3_root = niks3;

                niks3_bin = pkgs.lib.getExe niks3;
              })
          ')" >>$GITHUB_OUTPUT

      - uses: Mic92/niks3-action@fba0a36eda892f9b28b0ead8038f993920ecaff9 # v1.6.0
        with:
          niks3-bin: ${{ steps.fetch-niks3-bin.outputs.niks3_bin }}

          server-url: ${{ vars.NIKS3_SERVER }}

      # cache the built `fetch-niks3-bin` output so later runs can reuse it
      - run: ${{ steps.fetch-niks3-bin.outputs.niks3_bin }} push --server-url ${{ vars.NIKS3_SERVER }} --auth-token-script "node $RUNNER_TEMP/niks3/fetch-oidc-token.mjs" ${{ steps.fetch-niks3-bin.outputs.niks3_root }}

      - run: |
          set -o pipefail

          substituters=$(nix config show substituters)

          is_cached() {
            local base_name=${1#/nix/store/}
            local hash_part=${base_name%%-*}

            for substituter in $substituters; do
              nix store path-from-hash-part --store $substituter $hash_part >/dev/null 2>&1 && return 0
            done

            return 1
          }

          nix eval --raw --impure --expr '
            let
              lock = builtins.fromJSON (builtins.readFile ./devenv.lock);

              fetchNode = _: node:
                if node ? locked
                then let
                  cleanLocked = builtins.removeAttrs node.locked ["dir"];
                in
                  (builtins.fetchTree cleanLocked).outPath
                else null;

              paths = builtins.filter (path: path != null) (builtins.attrValues (builtins.mapAttrs fetchNode lock.nodes));
            in
              builtins.concatStringsSep "\n" paths + "\n"
          ' |
            sort --unique |
            while read path; do
              is_cached $path || printf '%s\n' $path
            done |
            xargs --no-run-if-empty ${{ steps.fetch-niks3-bin.outputs.niks3_bin }} push --server-url ${{ vars.NIKS3_SERVER }} --auth-token-script "node $RUNNER_TEMP/niks3/fetch-oidc-token.mjs"
